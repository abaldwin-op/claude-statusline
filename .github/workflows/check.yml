name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Renders fixture payloads across terminal sizes in a sandboxed HOME/TEMP and asserts the
      # width / height / blank-row invariants (see check.js).
      - run: bun check.js
